name: Ashling CMSIS Packs

on:
  push:
    branches: [main]
    paths:
      - "PicoJPEG/**"
      - "QEMU_RISCV_DFP/**"
      - "QEMU_RISCV_BSP/**"
      - "SiFive_E_DFP/**"
      - "ArtyA7-100T_BSP/**"
  pull_request:
    paths:
      - "PicoJPEG/**"
      - "QEMU_RISCV_DFP/**"
      - "QEMU_RISCV_BSP/**"
      - "SiFive_E_DFP/**"
      - "ArtyA7-100T_BSP/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# All packs are built and deployed to GitHub Pages as ONE site in a single
# job. This is deliberate for two reasons:
# 1. actions/deploy-pages replaces the entire Pages site with whatever's in
#    the uploaded artifact for that run - separate per-pack deploys would
#    each overwrite every other pack's already-published files.
# 2. PicoJPEG and the two BSP packs declare <requirements><packages> on
#    other packs in this repo. Validating that via packchk means building
#    dependencies first and staging their pdsc into a shared CMSIS_PACK_ROOT
#    - which requires one sequential job, not a parallel matrix (matrix jobs
#    run in isolated runners with no shared filesystem between entries).

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install packchk and xmlstarlet
        run: |
          curl -fsSL "https://github.com/Open-CMSIS-Pack/cmsis-toolbox/releases/download/2.14.1/cmsis-toolbox-linux-amd64.tar.gz" -o /tmp/cmsis-toolbox.tar.gz
          tar -xzf /tmp/cmsis-toolbox.tar.gz -C /tmp
          echo "/tmp/cmsis-toolbox-linux-amd64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq xmlstarlet

      - name: Build and validate all packs, in dependency order
        # DFPs have no pack dependencies. BSPs depend on their DFP. PicoJPEG
        # depends on all four. Each pack's own pdsc gets staged into
        # CMSIS_PACK_ROOT immediately after it's built (gen_pack.sh runs
        # packchk internally), so later packs in this list can resolve
        # their <requirements><packages>. Runs on every push/PR - this IS
        # the validation step, not just the publish step.
        env:
          CMSIS_PACK_ROOT: /home/runner/.cache/arm/packs
        run: |
          mkdir -p "${CMSIS_PACK_ROOT}"
          stage_pdsc() {
            local pack="$1"
            local pdsc
            pdsc=$(ls "$pack"/Ashling."$pack".pdsc)
            local version
            version=$(xmlstarlet sel -t -v "//releases/release[1]/@version" "$pdsc")
            local dest="${CMSIS_PACK_ROOT}/Ashling/${pack}/${version}"
            mkdir -p "$dest"
            cp "$pdsc" "$dest/"
          }
          for pack in QEMU_RISCV_DFP SiFive_E_DFP QEMU_RISCV_BSP ArtyA7-100T_BSP PicoJPEG; do
            ( cd "$pack" && bash gen_pack.sh )
            stage_pdsc "$pack"
          done

      - name: Assemble combined pack index site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          BASE_URL="https://ashlingmicrosystems.github.io/ashling-cmsis-packs"
          mkdir -p public
          PINDEX_ENTRIES=""
          for pack in QEMU_RISCV_DFP QEMU_RISCV_BSP SiFive_E_DFP ArtyA7-100T_BSP PicoJPEG; do
            PDSC="$pack/Ashling.$pack.pdsc"
            VERSION=$(xmlstarlet sel -t -v "//releases/release[1]/@version" "$PDSC")
            SITE="public/$pack"
            mkdir -p "$SITE"
            cp "$PDSC" "$SITE/"
            cp "$pack"/output/*.pack "$SITE/"
            PINDEX_ENTRIES="${PINDEX_ENTRIES}$(printf '    <pdsc url="%s/%s/" vendor="Ashling" name="%s" version="%s"/>\n' "$BASE_URL" "$pack" "$pack" "$VERSION")"
          done

          cat > "public/index.pidx" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <index schemaVersion="1.1.1" xmlns:xs="http://www.w3.org/2001/XMLSchema-instance" xs:noNamespaceSchemaLocation="PackIndex.xsd">
            <vendor>Ashling</vendor>
            <url>${BASE_URL}/</url>
            <timestamp>$(date -u +%Y-%m-%dT%H:%M:%S)</timestamp>
            <pindex>
          ${PINDEX_ENTRIES}    </pindex>
          </index>
          EOF

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: public

      - uses: actions/deploy-pages@v5
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: deployment
